description: >-
  Fanatics Holdings, Inc. is a global digital sports platform that connects
  fans with the teams, leagues, players, and events they love. Founded in 2011
  and led by Michael Rubin, the company operates across several business
  segments: Fanatics Commerce (licensed sports merchandise, e-commerce, and
  manufacturing), Fanatics Collectibles (trading cards and memorabilia,
  including Topps), and Fanatics Betting & Gaming (the Fanatics Sportsbook and
  online casino). It has no public developer API program or published API
  specification; it is tracked in the API Evangelist network as a company
  profile surfaced from a16z's venture portfolio.
